<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>B03 길 안내</title>
<link rel="stylesheet" href="../tokens.css"/>
<link rel="stylesheet" href="../styles.css"/>
<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<section class="phone" data-screen="B03">
  <div class="statusbar"><span>9:41</span><span class="status-icons">● ◔ ▰</span></div>
  <header class="appbar">
    <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="appbar__center"><h2>김○○님 댁</h2><span>이동 중</span></div>
    <button class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg></button>
  </header>
  <div class="move-summary">
    <span class="badge badge--caution">휴식 권장</span>
    <div class="ai-rec"><strong>추천 휴식 1회</strong><span class="ai-label">AI 분석</span></div>
  </div>
  <div class="map-area map-area--moving">
<svg class="map-svg" viewBox="0 0 375 470">
  <rect width="375" height="470" fill="#F7F9FB"/>
  <g class="map-street">
    <path d="M-10 80 L120 50 L200 120 L390 90"/><path d="M20 180 L100 120 L250 160 L370 140"/>
    <path d="M0 300 L90 250 L190 320 L375 250"/><path d="M60 0 L70 470M180 0 L160 470M300 0 L320 470"/>
  </g>
  <path d="M75 385 L110 345 L145 310 L180 275 L220 240 L255 195 L290 145" class="route-line route-safe"/>
  <circle cx="75" cy="385" r="10" class="current-dot"/>
  <circle cx="290" cy="145" r="10" class="destination-dot"/>
  <circle cx="220" cy="240" r="9" class="shelter-dot"/>
  <circle cx="110" cy="160" r="7" class="shelter-dot shelter-dot--muted"/>
  <circle cx="325" cy="250" r="7" class="shelter-dot shelter-dot--muted"/>
  <circle cx="245" cy="95" r="7" class="shelter-dot shelter-dot--muted"/>
</svg></div>
  <div class="guidance-sheet">
    <div class="sheet-handle"></div>
    <div class="guidance-main"><strong>18분</strong><span>•</span><span>1.2km</span></div>
    <p>김○○님 댁까지</p>
    <article class="shelter-summary">
      <div><span class="tiny-label">추천 쉼터</span><strong>창신동 주민센터</strong><small>경로상 약 10분 후 도착</small></div>
      <button class="button button--small button--ghost">자세히 보기</button>
    </article>
    <div class="button-row"><button class="button button--secondary">쉼터 건너뛰기</button><button class="button button--teal">길 안내 종료</button></div>
  </div>
</section></body>
</html>
