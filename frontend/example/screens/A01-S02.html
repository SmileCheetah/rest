<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>A01-S02 일정 삭제</title>
<link rel="stylesheet" href="../tokens.css"/>
<link rel="stylesheet" href="../styles.css"/>
<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<section class="phone" data-screen="A01-S02">
  <div class="statusbar"><span>9:41</span><span class="status-icons">● ◔ ▰</span></div>
  <header class="appbar"><h2>오늘의 방문 일정</h2></header>
  <div class="screen-content">

    <section class="weather-card">
      <div class="weather-metrics">
        <div class="weather-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg></div>
        <div class="metric"><strong>34°C</strong><span>현재 기온</span></div>
        <div class="metric"><strong>36°C</strong><span>체감 온도</span></div>
        <div class="metric"><strong>72%</strong><span>습도</span></div>
      </div>
      <div class="weather-footer"><span>폭염 영향예보</span><span class="badge badge--caution">주의</span></div>
    </section>
    <div class="section-header"><div class="section-title-row"><h3>오늘의 방문</h3><span class="muted">2 / 4 완료</span></div></div>
    <article class="visit-card">
      <div class="visit-card__head">
        <div class="visit-index">2</div>
        <div class="visit-main"><div class="visit-title"><strong>11:30</strong><span>이○○</span></div><p>종로구 창신동 ○○길 00</p></div>
        <button class="icon-btn icon-btn--sm"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
      </div>
      <div class="context-menu"><button>일정에서 삭제</button></div>
    </article>
  </div>
</section></body>
</html>
