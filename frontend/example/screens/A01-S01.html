<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>A01-S01 대상자 추가</title>
<link rel="stylesheet" href="../tokens.css"/>
<link rel="stylesheet" href="../styles.css"/>
<style>body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}</style>
</head>
<body>
<section class="phone overlay-phone" data-screen="A01-S01">
  <div class="dim"></div>
  <div class="bottom-sheet bottom-sheet--tall">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>대상자 추가</h2><button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="sheet-lead">오늘 방문할 대상자를 선택해주세요.</p>
    <label class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="이름 검색"/></label>
    <div class="chip-grid">
      <button class="select-chip select-chip--active">김○○</button><button class="select-chip">이○○</button>
      <button class="select-chip">박○○</button><button class="select-chip">최○○</button>
      <button class="select-chip">정○○</button><button class="select-chip">한○○</button>
      <button class="select-chip">조○○</button><button class="select-chip">윤○○</button>
    </div>
    <div class="form-group"><label>방문 예정 시간</label><div class="time-input"><span>14</span><span>:</span><span>30</span></div></div>
    <button class="button button--primary button--full">일정에 추가</button>
  </div>
</section></body>
</html>
